{{ define "main" }}
<article class="blog-post">
  <header>
    <h1>{{ .Title }}</h1>
    <p class="meta">{{ .Date.Format "January 2, 2006" }}</p>
  </header>
  
  <div class="content">
    {{ .Content }}
  </div>
  
  <footer>
    <a href="/blog/">← Back to Blog</a>
  </footer>
</article>

<style>
  .blog-post { max-width: 800px; margin: 0 auto; padding: 20px; }
  .blog-post header { margin-bottom: 40px; }
  .blog-post h1 { margin: 0 0 10px 0; }
  .meta { color: #666; font-size: 0.9em; }
  .content { line-height: 1.6; }
  .content h2 { margin-top: 40px; }
</style>
{{ end }}
