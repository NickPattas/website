<header style="
  background: #2a1639; /* solid dark purple full-bleed */
  backdrop-filter: blur(10px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  position: sticky;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 14px 0;
  width: 100vw;
  box-sizing: border-box;
">
  <div style="
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: flex-start; /* logo stays left */
    align-items: center;
    gap: 20px;
      /* container should NOT be positioned; nav is positioned relative to header */
    background: transparent; /* ensure no inner bar color */
  ">
    <div class="site-logo" style="font-size: 1.1em; font-weight: 700; color: white;">
      <a href="/" style="text-decoration: none; color: inherit;">
        {{ .Site.Params.logo | default .Site.Title }}
      </a>
    </div>
    
  <nav style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);">
      <ul style="
        display: flex;
        gap: 12px;
        list-style: none;
        margin: 0;
        padding: 0;
        align-items: center;
      ">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" style="
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 0; /* vertical padding only */
            width: 140px; /* fixed width for consistent size */
            display: inline-block;
            text-align: center;
            border-radius: 22px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.18s ease;
            box-shadow: 0 4px 12px rgba(154, 2, 224, 0.35);
            box-sizing: border-box;
          ">{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>

<style>
/* subtle hover for nav buttons */
nav a:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(154, 2, 224, 0.5) !important;
}

/* ensure the header bar stays full-bleed on small/large viewports */
header { left: 0; right: 0; width: 100vw; }

/* ensure inner container doesn't show a separate background/band */
header > div { background: transparent !important; }

/* reduce large gaps on very narrow screens */
@media (max-width: 640px) {
  nav ul { gap: 8px; }
  nav a { width: 110px; font-size: 0.95rem; }
}
</style>

<style>
/* mobile: nav should be static inside flow when header height is small */
@media (max-width: 780px) {
  header div > nav { position: static !important; transform: none !important; margin-left: 0; }
  header div { padding-right: 12px; }
}
</style>
