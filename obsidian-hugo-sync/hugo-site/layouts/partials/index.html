{{ define "main" }}
<div class="hero-section" style="
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 60vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  padding: 60px 20px;
  position: relative;
  overflow: hidden;
">
  <!-- Animated stars background -->
  <div style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none;">
    {{ range seq 50 }}
    <div class="star" style="
      --star-top: {{ mod (mul . 7) 100 }}%;
      --star-left: {{ mod (mul . 13) 100 }}%;
      --star-opacity: {{ div (mod . 7) 10.0 }};
      --star-duration: {{ add 2 (mod . 3) }}s;
    "></div>
    {{ end }}
  </div>

  <div style="position: relative; z-index: 1; max-width: 800px;">
    <h1 style="
      font-size: 3.5em;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(to right, #60efff, #0061ff, #ff00d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    ">Nick Pattas</h1>
    
    <p style="font-size: 1.5em; margin-bottom: 10px; opacity: 0.95;">
      {{ .Site.Params.subtitle }}
    </p>
    
    <!-- Social Media Icons -->
    <div style="margin: 30px 0; display: flex; justify-content: center; gap: 20px;">
      {{ if .Site.Params.email }}
      <a href="mailto:{{ .Site.Params.email }}" style="
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        height: 50px;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        color: white;
        text-decoration: none;
        font-size: 1.5em;
        transition: all 0.3s ease;
      " onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'; this.style.borderColor='rgba(255, 255, 255, 0.5)';" onmouseout="this.style.background='rgba(255, 255, 255, 0.2)'; this.style.borderColor='rgba(255, 255, 255, 0.3)';">
        ✉
      </a>
      {{ end }}
      
      {{ if .Site.Params.artstation }}
      <a href="{{ .Site.Params.artstation }}" target="_blank" rel="noopener noreferrer" style="
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        height: 50px;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        color: white;
        text-decoration: none;
        font-size: 1.5em;
        transition: all 0.3s ease;
      " onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'; this.style.borderColor='rgba(255, 255, 255, 0.5)';" onmouseout="this.style.background='rgba(255, 255, 255, 0.2)'; this.style.borderColor='rgba(255, 255, 255, 0.3)';">
        🎨
      </a>
      {{ end }}
      
      {{ if .Site.Params.linkedin }}
      <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener noreferrer" style="
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        height: 50px;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        color: white;
        text-decoration: none;
        font-size: 1.5em;
        transition: all 0.3s ease;
      " onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'; this.style.borderColor='rgba(255, 255, 255, 0.5)';" onmouseout="this.style.background='rgba(255, 255, 255, 0.2)'; this.style.borderColor='rgba(255, 255, 255, 0.3)';">
        💼
      </a>
      {{ end }}
    </div>
    
    <p style="font-size: 1.1em; opacity: 0.85; max-width: 600px; margin: 0 auto;">
      {{ .Site.Params.description }}
    </p>
  </div>
</div>

<style>
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  top: var(--star-top);
  left: var(--star-left);
  opacity: var(--star-opacity);
  animation: twinkle var(--star-duration) infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
</style>

<div class="content-section" style="max-width: 900px; margin: 60px auto; padding: 0 20px;">
  {{ .Content }}
</div>
{{ end }}
