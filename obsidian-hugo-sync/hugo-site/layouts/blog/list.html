{{ define "main" }}
<div class="blog-container">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  
  <div class="blog-posts">
    {{ range .Pages }}
      <article class="blog-post-preview">
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <p class="meta">{{ .Date.Format "January 2, 2006" }}</p>
        <p>{{ .Summary }}</p>
        <a href="{{ .Permalink }}">Read more →</a>
      </article>
    {{ end }}
  </div>
</div>

<style>
  .blog-container { max-width: 800px; margin: 0 auto; padding: 20px; }
  .blog-post-preview { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
  .blog-post-preview h2 { margin: 0 0 10px 0; }
  .blog-post-preview h2 a { color: #333; text-decoration: none; }
  .blog-post-preview h2 a:hover { color: #0066cc; }
  .meta { color: #666; font-size: 0.9em; }
</style>
{{ end }}
